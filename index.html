<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORBUS | Acesso</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at center, #241006 0%, #0b0806 45%, #050505 100%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

.logo {
    color: #ff6500;
    font-size: 42px;
    letter-spacing: 12px;
    font-weight: bold;
    text-shadow: 0 0 20px #ff650088;
}

.subtitulo {
    color: #888;
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 10px;
    margin-bottom: 25px;
}

.painel {
    background: rgba(18, 18, 18, 0.95);
    border: 1px solid #713000;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 0 35px #ff650022;
}

.mascote {
    width: 125px;
    height: 125px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #ff6500;
    box-shadow: 0 0 25px #ff650055;
    margin-bottom: 20px;
}

h2 {
    color: #ff6500;
    font-size: 20px;
    letter-spacing: 3px;
    margin-bottom: 8px;
}

.descricao {
    color: #888;
    font-size: 13px;
    margin-bottom: 25px;
}

.campo {
    text-align: left;
    margin-bottom: 18px;
}

.campo label {
    display: block;
    color: #bbb;
    font-size: 12px;
    margin-bottom: 8px;
}

.campo input {
    width: 100%;
    padding: 14px;
    background: #090909;
    border: 1px solid #393939;
    border-radius: 8px;
    color: white;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
}

.campo input:focus {
    border-color: #ff6500;
    box-shadow: 0 0 12px #ff650033;
}

.senha-box {
    display: flex;
    position: relative;
}

.senha-box input {
    padding-right: 65px;
}

.mostrar {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #ff8533;
    cursor: pointer;
    font-size: 11px;
}

.entrar {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    background: #ff6500;
    color: #080808;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
}

.entrar:hover {
    background: #ff8533;
    box-shadow: 0 0 20px #ff650066;
    transform: translateY(-2px);
}

.links {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 22px;
}

.links button {
    background: none;
    border: none;
    color: #ff8533;
    font-size: 12px;
    cursor: pointer;
}

.links button:hover {
    color: white;
}

.linha {
    height: 1px;
    background: #292929;
    margin: 25px 0 18px;
}

.rodape {
    color: #555;
    font-size: 11px;
    letter-spacing: 2px;
}

@media (max-width: 480px) {
    .painel {
        padding: 22px;
    }

    .logo {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">MORBUS</div>
    <div class="subtitulo">SUA TELA, SUA CONEXÃO</div>

    <div class="painel">

        <img
            src="morbus-mascote.png.png"
            alt="Mascote MORBUS"
            class="mascote"
        >

        <h2>BEM-VINDO</h2>

        <p class="descricao">
            Entre na sua comunidade.
        </p>

        <form id="formLogin">

            <div class="campo">
                <label for="usuario">USUÁRIO</label>
                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite seu usuário"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">SENHA</label>

                <div class="senha-box">
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="mostrar"
                        onclick="mostrarSenha()"
                    >
                        MOSTRAR
                    </button>
                </div>
            </div>

            <button type="submit" class="entrar">
                ENTRAR NO MORBUS
            </button>

        </form>

        <div class="links">

            <button type="button" onclick="aviso('A recuperação de senha será implementada futuramente.')">
                Esqueci a senha
            </button>

            <button type="button" onclick="aviso('O cadastro será implementado futuramente.')">
                Criar conta
            </button>

        </div>

        <div class="linha"></div>

        <div class="rodape">
            MORBUS © 2026
        </div>

    </div>

</div>

<script>
function mostrarSenha() {
    const campo = document.getElementById("senha");
    const botao = document.querySelector(".mostrar");

    if (campo.type === "password") {
        campo.type = "text";
        botao.textContent = "OCULTAR";
    } else {
        campo.type = "password";
        botao.textContent = "MOSTRAR";
    }
}

function aviso(mensagem) {
    alert(mensagem);
}

document.getElementById("formLogin").addEventListener("submit", function(event) {
    event.preventDefault();
    aviso("O sistema de autenticação será implementado em uma próxima etapa!");
});
</script>

</body>
</html>
